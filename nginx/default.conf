# No host routing. localhost is Istoletha Town.
#
# The tnkrfun alien site still exists in site/, but it is not served: its links are
# absolute (/breeder/, /tinker-impact/), so it can only ever live at the root, and the
# root is the town's now. Bringing it back means either host routing again or rewriting
# those links — a deployment problem, for a later day.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/istoletha;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
