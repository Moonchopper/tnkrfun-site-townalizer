# Istoletha Town, on http://localhost:8025. No host headers, no hosts file, no routing.
#
#   docker compose up -d                          live bind-mounts — publish a dispatch,
#                                                 refresh the browser, that's it
#   docker compose --profile prod up -d --build   the real image from the Dockerfile, :8026

services:
  web:
    image: nginx:alpine
    volumes:
      - ./istoletha:/usr/share/nginx/istoletha:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8025:80"
    restart: unless-stopped

  prod:
    profiles: [prod]
    build:
      context: .
    image: townalizer-site:local
    ports:
      - "8026:80"
    restart: unless-stopped
